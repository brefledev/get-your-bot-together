<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">The improvement conversation</title><desc id="desc">Find a real problem, then show a useful proposal, then owner chooses, then apply and check. Owner choice precedes persistent changes. Optional outputs: better instructions, project template, handoff, configured check. Reading begins a conversation, not installation.</desc><rect width="1600" height="960" rx="24" fill="#03080b"/><text x="64" y="112" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="80" font-weight="400" text-anchor="start" fill="#f3eddf">The improvement conversation</text><rect x="56" y="186" width="330" height="286" rx="18" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="221" y="245" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="46" font-weight="400" text-anchor="middle" fill="#8bc8b6">1</text><text x="221" y="335" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">Find a real</text><text x="221" y="407" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">problem</text><path d="M400,326 H415 V317 L428,330 L415,343 V334 H400 Z" fill="#8bc8b6"/><rect x="442" y="186" width="330" height="286" rx="18" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="607" y="245" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="46" font-weight="400" text-anchor="middle" fill="#8bc8b6">2</text><text x="607" y="306" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">Show a</text><text x="607" y="364" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">useful</text><text x="607" y="422" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">proposal</text><path d="M786,326 H801 V317 L814,330 L801,343 V334 H786 Z" fill="#8bc8b6"/><rect x="828" y="186" width="330" height="286" rx="18" fill="#0a181b" stroke="#c28d48" stroke-width="3"/><text x="993" y="245" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="46" font-weight="400" text-anchor="middle" fill="#dca458">3</text><text x="993" y="335" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">Owner</text><text x="993" y="407" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">chooses</text><path d="M1172,326 H1187 V317 L1200,330 L1187,343 V334 H1172 Z" fill="#8bc8b6"/><rect x="1214" y="186" width="330" height="286" rx="18" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="1379" y="245" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="46" font-weight="400" text-anchor="middle" fill="#8bc8b6">4</text><text x="1379" y="335" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">Apply</text><text x="1379" y="407" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#f3eddf">and check</text><text x="800" y="557" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#c4d2c8">Reading starts a conversation, not an installation.</text><text x="800" y="625" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="56" font-weight="400" text-anchor="middle" fill="#8bc8b6">Changes follow your approval.</text><text x="72" y="720" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="52" font-weight="400" text-anchor="start" fill="#c4d2c8">Optional outputs</text><rect x="72" y="758" width="704" height="72" rx="14" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="424" y="810" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">Better instructions</text><rect x="824" y="758" width="704" height="72" rx="14" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="1176" y="810" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">Project template</text><rect x="72" y="848" width="704" height="72" rx="14" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="424" y="900" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">Handoff</text><rect x="824" y="848" width="704" height="72" rx="14" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="1176" y="900" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">Configured check</text></svg>