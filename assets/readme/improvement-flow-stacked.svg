<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1800" viewBox="0 0 900 1800" role="img" aria-labelledby="title desc"><title id="title">The improvement conversation</title><desc id="desc">Same four-step improvement conversation, reflowed vertically for a narrow reading width. Owner chooses before apply and check. Optional outputs are examples, not required installations.</desc><rect width="900" height="1800" rx="24" fill="#03080b"/><text x="64" y="100" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="72" font-weight="400" text-anchor="start" fill="#f3eddf">The improvement</text><text x="64" y="184" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="72" font-weight="400" text-anchor="start" fill="#f3eddf">conversation</text><rect x="64" y="244" width="772" height="174" rx="18" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="118" y="344" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="54" font-weight="400" text-anchor="middle" fill="#8bc8b6">1</text><text x="202" y="316" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="64" font-weight="400" text-anchor="start" fill="#f3eddf">Find a real</text><text x="202" y="390" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="64" font-weight="400" text-anchor="start" fill="#f3eddf">problem</text><path d="M446,431 V448 H437 L450,461 L463,448 H454 V431 Z" fill="#8bc8b6"/><rect x="64" y="474" width="772" height="174" rx="18" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="118" y="574" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="54" font-weight="400" text-anchor="middle" fill="#8bc8b6">2</text><text x="202" y="546" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="64" font-weight="400" text-anchor="start" fill="#f3eddf">Show a useful</text><text x="202" y="620" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="64" font-weight="400" text-anchor="start" fill="#f3eddf">proposal</text><path d="M446,661 V678 H437 L450,691 L463,678 H454 V661 Z" fill="#8bc8b6"/><rect x="64" y="704" width="772" height="174" rx="18" fill="#0a181b" stroke="#c28d48" stroke-width="3"/><text x="118" y="804" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="54" font-weight="400" text-anchor="middle" fill="#dca458">3</text><text x="202" y="776" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="64" font-weight="400" text-anchor="start" fill="#f3eddf">Owner</text><text x="202" y="850" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="64" font-weight="400" text-anchor="start" fill="#f3eddf">chooses</text><path d="M446,891 V908 H437 L450,921 L463,908 H454 V891 Z" fill="#8bc8b6"/><rect x="64" y="934" width="772" height="174" rx="18" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="118" y="1034" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="54" font-weight="400" text-anchor="middle" fill="#8bc8b6">4</text><text x="202" y="1006" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="64" font-weight="400" text-anchor="start" fill="#f3eddf">Apply</text><text x="202" y="1080" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="64" font-weight="400" text-anchor="start" fill="#f3eddf">and check</text><text x="64" y="1190" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="start" fill="#c4d2c8">Reading starts a conversation,</text><text x="64" y="1250" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="start" fill="#c4d2c8">not an installation.</text><text x="64" y="1320" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="start" fill="#8bc8b6">Changes follow your approval.</text><text x="64" y="1400" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="start" fill="#c4d2c8">Optional outputs</text><rect x="64" y="1440" width="370" height="132" rx="14" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="249" y="1492" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">Better</text><text x="249" y="1550" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">instructions</text><rect x="466" y="1440" width="370" height="132" rx="14" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="651" y="1492" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">Project</text><text x="651" y="1550" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">template</text><rect x="64" y="1595" width="370" height="132" rx="14" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="249" y="1673" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">Handoff</text><rect x="466" y="1595" width="370" height="132" rx="14" fill="#0a181b" stroke="#32534c" stroke-width="2"/><text x="651" y="1647" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">Configured</text><text x="651" y="1705" font-family="Calistoga, Georgia, &apos;Times New Roman&apos;, serif" font-size="48" font-weight="400" text-anchor="middle" fill="#f3eddf">check</text></svg>